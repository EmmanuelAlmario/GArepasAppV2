<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Recetas', 'recetas', ~{::contenido})}">
<body>
<th:block th:fragment="acciones">
    <a th:href="@{/recetas/nuevo}" class="btn btn-primary">Agregar receta</a>
</th:block>
<div th:fragment="contenido">
    <th:block th:replace="~{fragments/page-header :: pageHeader('Recetas', 'Composición de cada producto y su costo calculado con los precios actuales de los insumos.', ~{::acciones})}"></th:block>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <caption class="visually-hidden">Recetas con su cantidad de insumos y costo total</caption>
                <thead class="table-light">
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Descripción</th>
                    <th scope="col" class="text-end">Insumos</th>
                    <th scope="col" class="text-end">Costo total</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(recetas)}">
                    <td colspan="5">
                        <div th:replace="~{fragments/empty-state :: empty('No hay recetas registradas', 'Una receta describe los insumos de un producto y permite calcular su costo.')}"></div>
                    </td>
                </tr>
                <tr th:each="r : ${recetas}">
                    <td class="fw-semibold" th:text="${r.nombre}">Nombre</td>
                    <td th:text="${r.descripcion} ?: '—'">Descripción</td>
                    <td class="text-end" th:text="${#lists.size(r.detalles)}">0</td>
                    <td class="text-end" th:text="${fmt.moneda(r.costoTotal)}">$0</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/recetas/{id}/editar(id=${r.id})}"
                           th:aria-label="'Editar receta ' + ${r.nombre}">Editar</a>
                        <form class="d-inline" method="post"
                              th:action="@{/recetas/{id}/eliminar(id=${r.id})}"
                              data-confirm="¿Eliminar esta receta? No se puede si está asociada a un producto.">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:aria-label="'Eliminar receta ' + ${r.nombre}">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
