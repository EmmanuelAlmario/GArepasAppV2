<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesion')}"></head>
<body class="ga-login">
<section class="ga-login__marca" aria-label="Gordo Arepas">
    <div>
        <img class="ga-login__logo" th:src="@{/images/gordo_arepas_logo.png}" alt="" width="48" height="48">
        <span class="ga-login__sub">Sistema de gestion</span>
    </div>

    <div>
        <h1 class="ga-login__titulo">Gordo<br>Arepas</h1>
        <p class="ga-login__lema">Produccion, ventas, inventario y reportes de tu negocio en un solo lugar.</p>
    </div>

</section>

<main class="ga-login__panel">
    <div class="ga-login__caja">
        <h2 class="h3 mb-1">Iniciar sesion</h2>
        <p class="text-muted mb-4">Entra con tu usuario del negocio.</p>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Usuario o contrasena incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">
            Sesion cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus
                       autocomplete="username">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contrasena</label>
                <input type="password" id="password" name="password" class="form-control" required
                       autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Ingresar</button>
        </form>
    </div>
</main>
</body>
</html>
