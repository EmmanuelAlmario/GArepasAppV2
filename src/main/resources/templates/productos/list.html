<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Productos', 'productos', ~{::contenido})}">
<body>
<th:block th:fragment="acciones">
    <a th:href="@{/productos/nuevo}" class="btn btn-primary">Agregar producto</a>
</th:block>
<div th:fragment="contenido">
    <th:block th:replace="~{fragments/page-header :: pageHeader('Productos', 'Catálogo que se vende en el punto de venta. El margen se calcula sobre el precio de venta.', 'Inventario', ~{::acciones})}"></th:block>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <caption class="visually-hidden">Productos con stock, precio, costo y receta asociada</caption>
                <thead class="table-light">
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col" class="text-end">Stock</th>
                    <th scope="col" class="text-end">Precio venta</th>
                    <th scope="col" class="text-end">Costo unitario</th>
                    <th scope="col" class="text-end">Margen</th>
                    <th scope="col">Receta</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="8">
                        <div th:replace="~{fragments/empty-state :: empty('No hay productos registrados', 'Agrega el primer producto para poder venderlo en el punto de venta.', 'bi-cup-hot')}"></div>
                    </td>
                </tr>
                <tr th:each="p : ${productos}">
                    <td class="fw-semibold" th:text="${p.nombre}">Nombre</td>
                    <td class="text-end">
                        <span th:text="${p.stockActual}">0</span>
                        <span th:if="${p.stockBajo}" class="badge text-bg-danger ms-1">Bajo</span>
                    </td>
                    <td class="text-end" th:text="${fmt.moneda(p.precioVenta)}">$0</td>
                    <td class="text-end" th:text="${fmt.moneda(p.costoUnitario)}">$0</td>
                    <td class="text-end" th:text="${fmt.porcentaje(p.margenPorcentaje)}">0%</td>
                    <td>
                        <span th:if="${p.recetaNombre}" th:text="${p.recetaNombre}">Receta</span>
                        <span th:unless="${p.recetaNombre}" class="text-muted">Sin receta</span>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${p.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${p.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/productos/{id}/editar(id=${p.id})}"
                           th:aria-label="'Editar ' + ${p.nombre}">Editar</a>
                        <form class="d-inline" method="post"
                              th:action="@{/productos/{id}/eliminar(id=${p.id})}"
                              data-confirm="¿Eliminar este producto? No se puede si tiene ventas o producciones asociadas.">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:aria-label="'Eliminar ' + ${p.nombre}">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
