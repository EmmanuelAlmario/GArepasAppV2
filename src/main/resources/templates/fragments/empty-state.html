<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Estado vacío o sin resultados.
  Uso: th:replace="~{fragments/empty-state :: empty('Sin registros', 'Detalle opcional', 'bi-inbox')}"
-->
<div th:fragment="empty(titulo, detalle, icono)" class="ga-empty-state">
    <span class="ga-empty-state__icono" aria-hidden="true">
        <i class="bi" th:classappend="${icono != null and !#strings.isEmpty(icono)} ? ${icono} : 'bi-inbox'"></i>
    </span>
    <p class="ga-empty-state__titulo" th:text="${titulo}">Sin datos</p>
    <p class="ga-empty-state__detalle"
       th:if="${detalle != null and !#strings.isEmpty(detalle)}"
       th:text="${detalle}">Detalle</p>
</div>
</body>
</html>
