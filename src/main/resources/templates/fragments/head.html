<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <!-- viewport-fit=cover habilita los safe-areas cuando la app corre en modo standalone (PWA). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3A1610">
    <title th:text="${titulo} + ' · Gordo Arepas'">Gordo Arepas</title>
    <!-- PWA instalable: manifest, iconos y metas para agregar a pantalla de inicio.
         Se usa .json (y no .webmanifest) porque así Spring lo sirve con MIME
         application/json, que es lo que los navegadores exigen para parsearlo. -->
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gordo Arepas">
    <!-- Tipografía: Fraunces para los títulos de marca e Inter para la interfaz.
         Si las fuentes web no cargan, cae a las del sistema (degradación elegante). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400..700&display=swap"
          rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/images/gordo_arepas_logo.png}">
    <!-- Bootstrap 5.3.8 servido desde el propio servidor (sin CDN): la app
         no dependía de internet y, si el CDN caía, el modal de confirmación de
         borrado dejaba de funcionar y las acciones destructivas se enviaban
         sin preguntar. -->
    <link th:href="@{/vendor/css/bootstrap.min.css?v=5}" rel="stylesheet">
    <!-- Iconos de la navegación (Bootstrap Icons 1.11.3, servidos localmente). -->
    <link th:href="@{/vendor/css/bootstrap-icons.css?v=5}" rel="stylesheet">
    <!-- Estilos propios por capas: tokens → base → componentes → layout. -->
    <link rel="stylesheet" th:href="@{/css/tokens.css?v=5}">
    <link rel="stylesheet" th:href="@{/css/base.css?v=5}">
    <link rel="stylesheet" th:href="@{/css/components.css?v=5}">
    <link rel="stylesheet" th:href="@{/css/layout.css?v=5}">
    <!-- Registro del service worker: habilita el modo standalone y el acceso sin conexión. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body>
<!-- Fragmento de cabecera reutilizable: meta, Bootstrap, iconos y estilos propios. -->
</body>
</html>
