<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Mensajes flash enviados desde los controladores (RedirectAttributes):
     "mensaje" con el texto, "tipo" opcional: success | danger | warning | info -->
<div th:fragment="alert">
    <div th:if="${mensaje}" class="alert alert-dismissible fade show"
         th:classappend="'alert-' + (${tipo} != null ? ${tipo} : 'success')" role="alert">
        <i class="bi" aria-hidden="true"
           th:classappend="${tipo} == 'danger' ? 'bi-exclamation-triangle'
                     : (${tipo} == 'warning' ? 'bi-exclamation-circle'
                     : (${tipo} == 'info' ? 'bi-info-circle' : 'bi-check-circle'))"></i>
        <span th:text="${mensaje}">Mensaje</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>
</body>
</html>
