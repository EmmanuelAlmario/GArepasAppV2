<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Encabezado de página reutilizable.
  Uso: th:replace="~{fragments/page-header :: pageHeader('Insumos', 'subtitulo', 'Etiqueta', ~{::acciones})}"
  El fragmento "acciones" se define fuera de "contenido" para que no se renderice dos veces.
-->
<div th:fragment="pageHeader(titulo, subtitulo, kicker, acciones)"
     class="ga-page-header">
    <div class="flex-grow-1">
        <p class="ga-kicker" th:if="${kicker != null and !#strings.isEmpty(kicker)}" th:text="${kicker}">Panel</p>
        <h1 class="ga-page-header__titulo" th:text="${titulo}">Titulo</h1>
        <p class="ga-page-header__subtitulo"
           th:if="${subtitulo != null and !#strings.isEmpty(subtitulo)}"
           th:text="${subtitulo}">Subtitulo</p>
    </div>
    <div class="ga-page-header__acciones">
        <th:block th:replace="${acciones}"></th:block>
    </div>
</div>
</body>
</html>
