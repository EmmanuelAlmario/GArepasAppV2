<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>





<div th:fragment="formAlerts" class="mb-3" th:if="${error != null or aviso != null}">
    <div th:if="${error}" class="alert alert-danger mb-2" role="alert" th:text="${error}">Error</div>
    <div th:if="${aviso}" class="alert alert-info mb-2" role="status" th:text="${aviso}">Aviso</div>
</div>
</body>
</html>
