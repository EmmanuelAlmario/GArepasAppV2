<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Usuarios', 'usuarios', ~{::contenido})}">
<body>
<th:block th:fragment="acciones">
    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Crear usuario</a>
</th:block>
<div th:fragment="contenido">
    <th:block th:replace="~{fragments/page-header :: pageHeader('Usuarios', 'Administradores y registradores de ventas. El usuario admin no se puede eliminar.', 'Sistema', ~{::acciones})}"></th:block>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <caption class="visually-hidden">Usuarios del sistema con su rol y estado</caption>
                <thead class="table-light">
                <tr>
                    <th scope="col">Usuario</th>
                    <th scope="col">Rol</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="4">
                        <div th:replace="~{fragments/empty-state :: empty('No hay usuarios registrados', 'Crea un usuario para que pueda iniciar sesión.', 'bi-people')}"></div>
                    </td>
                </tr>
                <tr th:each="u : ${usuarios}">
                    <td class="fw-semibold" th:text="${u.username}">Usuario</td>
                    <td th:text="${u.rol.name() == 'ADMIN'} ? 'Administrador' : 'Registrador de ventas'">Rol</td>
                    <td>
                        <span class="badge" th:classappend="${u.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${u.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/usuarios/{id}/editar(id=${u.id})}"
                           th:aria-label="'Editar usuario ' + ${u.username}">Editar</a>
                        <form class="d-inline" method="post" th:if="${u.username != 'admin'}"
                              th:action="@{/usuarios/{id}/eliminar(id=${u.id})}"
                              data-confirm="¿Eliminar este usuario? No podrá iniciar sesión de nuevo.">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:aria-label="'Eliminar usuario ' + ${u.username}">Eliminar</button>
                        </form>
                        <span th:if="${u.username == 'admin'}" class="text-muted small">Usuario de respaldo</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
