<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Gastos', 'gastos', ~{::contenido})}">
<body>
<th:block th:fragment="acciones">
    <a th:href="@{/gastos/nuevo}" class="btn btn-primary">Registrar gasto</a>
</th:block>
<div th:fragment="contenido">
    <th:block th:replace="~{fragments/page-header :: pageHeader('Gastos', 'Gastos operativos del negocio. Los generados por una produccion se gestionan desde la produccion.', ~{::acciones})}"></th:block>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <caption class="visually-hidden">Gastos registrados, de la fecha mas reciente a la mas antigua</caption>
                <thead class="table-light">
                <tr>
                    <th scope="col">Descripcion</th>
                    <th scope="col">Categoria</th>
                    <th scope="col">Origen</th>
                    <th scope="col" class="text-end">Monto</th>
                    <th scope="col">Fecha</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(gastos)}">
                    <td colspan="6">
                        <div th:replace="~{fragments/empty-state :: empty('No hay gastos registrados', 'Registra servicios, transporte u otros gastos para que los reportes reflejen la utilidad real.')}"></div>
                    </td>
                </tr>
                <tr th:each="g : ${gastos}">
                    <td class="fw-semibold" th:text="${g.descripcion}">Descripcion</td>
                    <td th:text="${g.categoriaEtiqueta}">Categoria</td>
                    <td>
                        <span th:if="${g.produccionId != null}" class="badge text-bg-secondary">Produccion</span>
                        <span th:unless="${g.produccionId != null}" class="text-muted small">Manual</span>
                    </td>
                    <td class="text-end" th:text="${fmt.moneda(g.monto)}">$0</td>
                    <td th:text="${#temporals.format(g.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td class="text-end" th:if="${g.produccionId == null}">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/gastos/{id}/editar(id=${g.id})}">Editar</a>
                        <form class="d-inline" method="post"
                              th:action="@{/gastos/{id}/eliminar(id=${g.id})}"
                              data-confirm="¿Eliminar este gasto? Esta accion no se puede deshacer.">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                    <td class="text-end" th:if="${g.produccionId != null}">
                        <span class="text-muted small">Gestionado por la produccion #<span th:text="${g.produccionId}">0</span></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
