<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Ajustar stock', 'insumos', ~{::contenido})}">
<body>
<th:block th:fragment="acciones">
    <a th:href="@{/insumos}" class="btn btn-outline-secondary">Volver al listado</a>
</th:block>
<div th:fragment="contenido">
    <th:block th:replace="~{fragments/page-header :: pageHeader('Ajustar stock de insumos', 'Reponer compras, registrar mermas o consumo directo en una sola operacion.', ~{::acciones})}"></th:block>

    <div class="card shadow-sm form-card-lg">
        <div class="card-body">
            <p class="text-muted small">
                Cantidad positiva repone stock (compra); cantidad negativa lo consume (merma o consumo directo).
                La cantidad se ingresa en la unidad de medida del insumo.
            </p>

            <th:block th:replace="~{fragments/form-alerts :: formAlerts}"></th:block>

            <form method="post" th:action="@{/insumos/ajustar-stock}" th:object="${form}">
                <div id="filasAjuste">
                    <div data-fila class="row g-2 mb-2" th:each="fila, it : ${form.insumoId}">
                        <div class="col-12 col-md-6">
                            <label class="form-label small mb-1" th:for="'insumoId' + ${it.index}">Insumo</label>
                            <select name="insumoId" class="form-select" th:id="'insumoId' + ${it.index}">
                                <option value="">Selecciona un insumo...</option>
                                <option th:each="i : ${insumos}" th:value="${i.id}"
                                        th:selected="${form.insumoId[it.index] == i.id}"
                                        th:text="${i.nombre + ' · stock ' + fmt.cantidad(i.stockPresentacion()) + ' ' + i.unidadMedida.etiqueta}">
                                    Insumo
                                </option>
                            </select>
                        </div>
                        <div class="col-8 col-md-4">
                            <label class="form-label small mb-1" th:for="'cantidad' + ${it.index}">Cantidad (+ repone / − consume)</label>
                            <input type="number" step="0.01" name="cantidad" class="form-control"
                                   th:id="'cantidad' + ${it.index}" th:value="${form.cantidad[it.index]}" placeholder="0">
                        </div>
                        <div class="col-4 col-md-2 d-flex align-items-end">
                            <button type="button" data-quitar class="btn btn-outline-danger w-100">Quitar</button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-secondary btn-sm mb-3"
                        data-agregar="#plantillaFila" data-contenedor="#filasAjuste">+ Agregar otro insumo</button>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">Aplicar ajuste</button>
                    <a th:href="@{/insumos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <template id="plantillaFila">
        <div data-fila class="row g-2 mb-2">
            <div class="col-12 col-md-6">
                <label class="form-label small mb-1">Insumo</label>
                <select name="insumoId" class="form-select" aria-label="Insumo">
                    <option value="">Selecciona un insumo...</option>
                    <option th:each="i : ${insumos}" th:value="${i.id}"
                            th:text="${i.nombre + ' · stock ' + fmt.cantidad(i.stockPresentacion()) + ' ' + i.unidadMedida.etiqueta}">
                        Insumo
                    </option>
                </select>
            </div>
            <div class="col-8 col-md-4">
                <label class="form-label small mb-1">Cantidad (+ repone / − consume)</label>
                <input type="number" step="0.01" name="cantidad" class="form-control"
                       placeholder="0" aria-label="Cantidad">
            </div>
            <div class="col-4 col-md-2 d-flex align-items-end">
                <button type="button" data-quitar class="btn btn-outline-danger w-100">Quitar</button>
            </div>
        </div>
    </template>

    <script th:src="@{/js/filas.js}"></script>
</div>
</body>
</html>
