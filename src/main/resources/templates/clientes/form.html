<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${form.id} == null ? 'Nuevo cliente' : 'Editar cliente', 'clientes', ~{::contenido})}">
<body>
<th:block th:fragment="acciones">
    <a th:href="@{/clientes}" class="btn btn-outline-secondary">Volver al listado</a>
</th:block>
<div th:fragment="contenido">
    <th:block th:replace="~{fragments/page-header :: pageHeader(${form.id} == null ? 'Nuevo cliente' : 'Editar cliente', null, 'Panel', ~{::acciones})}"></th:block>

    <div class="card shadow-sm form-card">
        <div class="card-body">
            <th:block th:replace="~{fragments/form-alerts :: formAlerts}"></th:block>

            <form method="post" th:object="${form}"
                  th:action="${form.id} == null ? @{/clientes} : @{/clientes/{id}(id=${form.id})}">
                <p class="form-text">Los campos marcados con <span class="text-danger">*</span> son obligatorios.</p>

                <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
                    <p class="fw-semibold mb-1">Revisa los campos marcados:</p>
                    <ul class="mb-0">
                        <li th:each="e : ${#fields.errors('*')}" th:text="${e}">Error</li>
                    </ul>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="nombre">Nombre <span class="text-danger">*</span></label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                               th:attr="aria-describedby=${#fields.hasErrors('nombre')} ? 'nombre-error' : null">
                        <div class="invalid-feedback" id="nombre-error" th:errors="*{nombre}">Error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" th:field="*{telefono}" class="form-control"
                               placeholder="Opcional"
                               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
                        <div class="form-text">Para mandar recordatorios de cobro.</div>
                        <div class="invalid-feedback" th:errors="*{telefono}">Error</div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="direccion">Dirección</label>
                        <input type="text" id="direccion" th:field="*{direccion}" class="form-control"
                               placeholder="Opcional"
                               th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{direccion}">Error</div>
                    </div>

                    <div class="col-12">
                        <label class="form-label" for="notas">Notas</label>
                        <textarea id="notas" th:field="*{notas}" class="form-control" rows="3"
                                  placeholder="Opcional"
                                  th:classappend="${#fields.hasErrors('notas')} ? 'is-invalid'"></textarea>
                        <div class="form-text">Acuerdos de pago, referencias u observaciones del cliente.</div>
                        <div class="invalid-feedback" th:errors="*{notas}">Error</div>
                    </div>

                    <div class="col-12 col-md-6 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox" id="activo" th:field="*{activo}" class="form-check-input">
                            <label class="form-check-label" for="activo">Activo (puede fiar y comprar)</label>
                        </div>
                    </div>

                    <div class="col-12 d-flex flex-wrap gap-2 pt-2">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
