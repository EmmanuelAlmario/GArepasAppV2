<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(titulo, seccion, contenido)">
<head th:replace="~{fragments/head :: head(${titulo})}"></head>
<body class="ga-shell">
<a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>

<div th:replace="~{fragments/nav :: nav(${seccion})}"></div>

<main id="contenido" class="ga-app-main">
    <div th:replace="~{fragments/alert :: alert}"></div>
    <div th:replace="${contenido}"></div>
</main>

<div th:replace="~{fragments/confirm-modal :: confirmModal}"></div>

<!-- Guía de instalación en iPhone: Safari no dispara ningún prompt, el usuario
     instala desde Compartir -> Agregar a pantalla de inicio. Solo se muestra en
     Safari (no en la app ya instalada) y se puede descartar. -->
<div id="iosInstallHint" class="ios-install-hint" role="status" hidden>
    <span class="ios-install-hint__texto">
        Para instalar la app: toca <strong>Compartir</strong> y elige
        <strong>Agregar a pantalla de inicio</strong>.
    </span>
    <button type="button" class="btn-close btn-close-white" id="iosInstallHintCerrar"
            aria-label="Ocultar aviso"></button>
</div>

<!-- Bootstrap servido desde el propio servidor: sin CDN la app no depende
         de internet y el modal de confirmacion siempre funciona. -->
    <script th:src="@{/vendor/js/bootstrap.bundle.min.js?v=5}"></script>
<script th:src="@{/js/ui-feedback.js?v=5}"></script>
<script th:src="@{/js/tablas-moviles.js?v=5}"></script>
<script>
    // Muestra la guía solo en Safari del iPhone/iPad y aún no instalada.
    (function () {
        const aviso = document.getElementById('iosInstallHint');
        if (!aviso) return;

        const esIpadDesktop = /MacIntel/.test(navigator.platform) && navigator.maxTouchPoints > 1;
        const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || esIpadDesktop;
        const yaInstalada = window.matchMedia('(display-mode: standalone)').matches
            || navigator.standalone === true;
        const descartado = localStorage.getItem('gaAvisoInstalar') === 'no';

        if (esIOS && !yaInstalada && !descartado) {
            aviso.hidden = false;
        }

        const cerrar = document.getElementById('iosInstallHintCerrar');
        if (cerrar) {
            cerrar.addEventListener('click', () => {
                aviso.hidden = true;
                localStorage.setItem('gaAvisoInstalar', 'no');
            });
        }
    })();
</script>
</body>
</html>
