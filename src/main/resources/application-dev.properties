# =============================================================
# GArepasAppV2 — perfil `dev` (desarrollo local)
# =============================================================
# Se activa automaticamente con `./mvnw spring-boot:run`
# (ver configuracion del plugin en pom.xml).
# H2 en memoria + datos de prueba: se pierden al detener la app.
# =============================================================

# ---------- Base de datos (H2 en memoria) ----------
spring.datasource.url=jdbc:h2:mem:gordoarepas_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Desarrollo: esquema generado por Hibernate sobre H2 efimera. Flyway se
# verifica aparte en EsquemaFlywayTest.
spring.flyway.enabled=false

# ---------- Datos de prueba ----------
app.seed.demo-data=true

# ---------- CORS local: Vite (menu en desarrollo) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Valores comodos solo para desarrollo ----------
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
app.seed.demo-cajero-password=${CAJERO_PASSWORD:cajero123}