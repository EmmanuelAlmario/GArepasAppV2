# =============================================================
# GArepasAppV2 — configuracion base (compartida por perfiles)
# =============================================================
# Perfiles:
# - `dev`  -> application-dev.properties  (H2 en memoria + datos demo).
#             Se activa con `./mvnw spring-boot:run` (ver pom.xml).
# - `prod` -> application-prod.properties  (PostgreSQL).
#             Perfil por defecto: si no se activa ninguno, el jar
#             arranca en produccion (ver .env.example).
# =============================================================
spring.profiles.default=prod
spring.config.import=optional:file:.env

# ---------- Base de datos ----------
# El datasource lo define cada perfil (prod: PostgreSQL, dev: H2).
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# ---------- Healthcheck (solo estado, sin detalles) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Usuario admin inicial ----------
# Obligatoria en produccion: sin valor por defecto.
app.seed.admin-password=${ADMIN_PASSWORD}

# ---------- Datos de prueba ----------
# Solo se siembran con el perfil dev (DataSeeder esta anotado @Profile("dev")).
app.seed.demo-data=false

# ---------- CORS de la API publica del menu ----------
# Origenes permitidos (separados por comas), p. ej. https://menu.ejemplo.app.
# Vacio = ningun origen cruzado (denegado por defecto).
app.cors.allowed-origins=${CORS_ORIGINS:}

# Zona horaria del negocio (Colombia)
spring.jackson.time-zone=America/Bogota