<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3A1610">
    <title>Sin conexión · Gordo Arepas</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #F3EEE4;
            color: #1A0A06;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
        }

        .caja {
            max-width: 24rem;
        }

        .logo {
            width: 5rem;
            height: 5rem;
            margin-bottom: 1rem;
        }

        h1 {
            margin: 0 0 .5rem;
            color: #56241C;
            font-family: Fraunces, Georgia, "Times New Roman", serif;
            font-size: 1.6rem;
            font-weight: 600;
        }

        p {
            color: #6B5F57;
            margin: 0 0 1.25rem;
            line-height: 1.5;
        }

        .boton {
            display: inline-block;
            padding: .75rem 1.5rem;
            border-radius: .75rem;
            background: #C0430B;
            color: #FDFCF7;
            font-weight: 600;
            text-decoration: none;
            border: 0;
            font-size: 1rem;
            cursor: pointer;
        }

        .boton:hover,
        .boton:focus-visible {
            background: #9E3709;
        }
    </style>
</head>
<body>
<div class="caja">
    <img class="logo" src="/images/icon-192.png" alt="" width="80" height="80">
    <h1>Sin conexión a internet</h1>
    <p>No se pudo cargar esta página y no está guardada en tu dispositivo.
        Revisa tu conexión y vuelve a intentarlo.</p>
    <button class="boton" type="button" onclick="window.location.reload()">Reintentar</button>
</div>
</body>
</html>
