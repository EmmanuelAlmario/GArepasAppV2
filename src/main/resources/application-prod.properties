# =============================================================
# GArepasAppV2 — perfil `prod` (produccion, PostgreSQL)
# =============================================================
# Perfil por defecto (ver `spring.profiles.default=prod` en
# application.properties): si no se activa ningun perfil explicito,
# el jar arranca contra PostgreSQL.
# Obligatorias las variables de entorno: DB_URL, DB_USERNAME,
# DB_PASSWORD y ADMIN_PASSWORD (si falta alguna, ValidacionProduccion detiene el arranque).
# =============================================================

# ---------- Base de datos (PostgreSQL) ----------
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# TODO pendiente B4: pasar a `validate` con migraciones versionadas (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
