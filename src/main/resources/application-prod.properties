# =============================================================
# GArepasAppV2 — perfil `prod` (produccion, PostgreSQL)
# =============================================================
# Perfil por defecto (ver `spring.profiles.default=prod` en
# application.properties): si no se activa ningun perfil explicito,
# el jar arranca contra PostgreSQL.
# Obligatorias las variables de entorno: DB_URL, DB_USERNAME,
# DB_PASSWORD y ADMIN_PASSWORD (si falta alguna, ValidacionProduccion detiene el arranque).
# =============================================================

# ---------- Base de datos (PostgreSQL) ----------
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# ---------- Esquema: Flyway + validacion (B4) ----------
# La base de produccion ya existia con ddl-auto=update. Al primer arranque
# Flyway la marca en la version 1 (V1 = esquema base, ya presente) y solo
# ejecutara migraciones posteriores (V2, V3...). Hibernate solo VALIDA:
# si una entidad no coincide con la base, el arranque se detiene.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
